[project]
name = "chancellery"
version = "0.1.1"
description = "Библиотека русского склонения и генерации документов по шаблонам: ФИО, должности, звания по падежам + рендер docx"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Vladimir Kirievskiy", email = "vlakir73@yandex.ru"},
]
requires-python = ">=3.14"
keywords = ["russian", "declension", "morphology", "docx", "template", "documents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "docxtpl>=0.20.2",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "petrovich>=2.0.1",
    "pydantic>=2",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
]
[dependency-groups]
dev = [
    "ruff>=0.12.10",
    "mypy>=1.17.1",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-asyncio>=1.0",
    "twine>=7.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/chancellery"]


[project.urls]
Homepage = "https://github.com/vlakir/chancellery"
Issues = "https://github.com/vlakir/chancellery/issues"
Source = "https://github.com/vlakir/chancellery"
Changelog = "https://github.com/vlakir/chancellery/blob/main/CHANGELOG.md"


[tool.ruff]
unsafe-fixes = true
line-length = 88
indent-width = 4
target-version = "py314"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "build",
    "dist",
    "tests",
]


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1", "D203", "D212",
    "BLE001", "ANN002", "ANN204",
    "RUF001", "COM812", "RUF002",
    "RUF003", "G004", "PLR0912",
    "PLR0913", "D401", "PLR0915",
    "C901", "D205", "N802",
    "CPY001",
]
fixable = ["ALL"]
unfixable = []


[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"


[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
mypy_path = "src"


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
# Покрытие намеренно НЕ входит в дефолтный `addopts`: трассировщик покрытия
# копит данные и заметно раздувает пиковый RSS прогона, поэтому дефолтный
# `pytest` остаётся лёгким для повторяющейся локальной итерации (важно, когда
# несколько git worktree делят одну машину — см. CLAUDE.md, раздел про
# мьютекс-обёртку). Порог ≥ 80 % при этом сохранён — он держится явной
# командой в pre-push-гейте и CI (через ту же обёртку):
#   scripts/pytest-guard.sh --cov=src --cov-report=term-missing --cov-fail-under=80
addopts = "-q --tb=short"
testpaths = ["tests"]


[tool.coverage.run]
source = ["src"]
branch = true


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false
