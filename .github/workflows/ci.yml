# Четыре гейта проекта на каждый push и pull request.
# Прогон изолированный, поэтому мьютекс-обёртка не нужна: делить нечего.
name: Гейты

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Поставить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Поставить зависимости
        run: uv sync --all-extras --dev

      - name: Линтер
        run: uv run ruff check .

      - name: Формат
        run: uv run ruff format --check .

      - name: Типы
        run: uv run mypy src

      - name: Тесты и покрытие
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80
