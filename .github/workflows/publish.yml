# Публикация на публичный PyPI по git-тегу через Trusted Publishing.
#
# Токенов в секретах нет: PyPI доверяет самому workflow по OIDC-удостоверению
# (поэтому `permissions: id-token: write` и окружение `pypi`). Выпуск версии
# сводится к `git tag` + `git push --tags`; ручных шагов не остаётся.
#
# Разовая настройка на стороне PyPI (делает владелец проекта): завести
# pending publisher для проекта `chancellery` — владелец `vlakir`,
# репозиторий `chancellery`, workflow `publish.yml`, окружение `pypi`.
name: Публикация

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Поставить uv
        uses: astral-sh/setup-uv@v5

      - name: Проверить, что тег совпадает с версией пакета
        run: |
          version=$(uv version --short)
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Тег ${GITHUB_REF_NAME} не совпадает с версией пакета $version"
            exit 1
          fi

      - name: Собрать колесо и архив исходников
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC-удостоверение для Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Опубликовать на PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
